plugins {
    id 'java'
}

group = project.findProperty('group') ?: 'com.pvzce'
version = project.findProperty('version') ?: '1.0.0'

allprojects {
    group = rootProject.group
    version = rootProject.version
}

subprojects {
    apply plugin: 'java'

    // One fact, one source: the toolchain and the class-file version are the same decision, and
    // they used to be two copies of it (gradle.properties said 21, this file said 21 by hand).
    def javaVersion = (project.findProperty('java_version') as String).toInteger()

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaVersion
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }
}
