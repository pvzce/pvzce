plugins {
    id 'java-library'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

base {
    archivesName = 'pvzce'
}

application {
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
}

sourceSets {
    testmod {
        java.srcDirs = ['src/testmod/java']
        resources.srcDirs = ['src/testmod/resources']
    }
}

tasks.named('compileTestmodJava') {
    classpath += sourceSets.main.output
}

tasks.register('testModJar', Jar) {
    archiveFileName = 'example-mod-1.0.0.jar'
    from sourceSets.testmod.output
    dependsOn tasks.named('testmodClasses')
}

dependencies {
    implementation project(':pvzce-loader')
    implementation project(':pvzce-api')

    // Platform
    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-openal'
    runtimeOnly 'org.lwjgl:lwjgl::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl::natives-macos'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-macos'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-macos'
    runtimeOnly 'org.lwjgl:lwjgl-stb::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-stb::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-stb::natives-macos'
    runtimeOnly 'org.lwjgl:lwjgl-openal::natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-openal::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-openal::natives-macos'

    // Serialization / data
    api "com.mojang:datafixerupper:${project.dfu_version}"
    api "com.google.code.gson:gson:${project.gson_version}"
    implementation "com.google.guava:guava:${project.guava_version}"
    implementation "it.unimi.dsi:fastutil:${project.fastutil_version}"
    implementation "com.mojang:brigadier:${project.brigadier_version}"
    implementation "com.moandjiezana.toml:toml4j:${project.toml4j_version}"

    // Logging
    implementation "org.slf4j:slf4j-api:${project.slf4j_version}"
    runtimeOnly "ch.qos.logback:logback-classic:${project.logback_version}"

    // Network (MC-style Connection architecture; memory transport in phase 1)
    implementation "io.netty:netty-buffer:${project.netty_version}"

    compileOnly 'org.jetbrains:annotations:23.0.0'

    testImplementation project(':pvzce-api')
    testmodImplementation project(':pvzce-loader')
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def lwjglNativesDir = layout.buildDirectory.dir('lwjgl-natives')

tasks.register('extractLwjglNatives', Copy) {
    from configurations.runtimeClasspath.filter { it.name.contains('natives-') }.collect { zipTree(it) }
    include '**/*.so', '**/*.dll', '**/*.dylib', '**/*.jnilib'
    into lwjglNativesDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Forward the smoke-style properties into the test JVM as well, so a diagnostic that is
// guarded by one (see AnimationPlayback's pvzce.traceLocomotion) can be switched on for a
// test run without editing the build file - the same reason `run` has this block.
// java.lang.foreign is how the Wayland touch layer reaches libwayland-client (GLFW has no touch
// API), and since JDK 24 every FFM entry point is a *restricted* method: without this flag the JVM
// prints a warning per call site and a future release will refuse outright. Any launcher that
// starts the game - not just this Gradle task - has to pass it too.
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

tasks.named('test') {
    // Diagnostics guarded by a property are useless if the forked JVM's stdout is swallowed;
    // this is what makes `-Ppvzce.smoke=pvzce.traceLocomotion=true` readable.
    testLogging.showStandardStreams = true
    jvmArgs nativeAccess

    // The documentation is a test input. DocumentedSymbolsTest, DocStatsTest and DocLedgerTest
    // read `docs/**` and AGENTS.md, but a doc-only edit used to leave this task UP-TO-DATE - so a
    // stale symbol reference or a stale scale block survived until someone unrelated touched a
    // .java file, which defeats the point of guarding the documents at all.
    inputs.dir(rootProject.file('docs')).withPropertyName('docs')
    inputs.file(rootProject.file('AGENTS.md')).withPropertyName('agentsInstructions')

    if (project.hasProperty('pvzce.smoke')) {
        project.property('pvzce.smoke').toString().split('\\s+').findAll { !it.isBlank() }.each { entry ->
            def parts = entry.split('=', 2)
            systemProperty parts[0], parts.length > 1 ? parts[1] : 'true'
        }
    }
}

run {
    // Development mode: classes are on the classpath instead of inside one fat jar.
    dependsOn tasks.named('extractLwjglNatives')
    jvmArgs nativeAccess
    systemProperty 'fabric.development', 'true'
    systemProperty 'org.lwjgl.librarypath', lwjglNativesDir.get().asFile.absolutePath

    // Forward smoke-test properties into the game JVM. Gradle's -D goes to the
    // Gradle daemon, not to a forked JavaExec, so without this the client's
    // pvzce.smoke*/capture hooks were unreachable from the command line and every
    // screenshot run needed a hand-edited build file.
    if (project.hasProperty('pvzce.smoke')) {
        project.property('pvzce.smoke').toString().split('\\s+').findAll { !it.isBlank() }.each { entry ->
            def parts = entry.split('=', 2)
            systemProperty parts[0], parts.length > 1 ? parts[1] : 'true'
        }
    }

    // Where the game keeps saves/, config/, mods/ and datapacks/. Defaults to
    // ~/.pvzce; a smoke run wants a throwaway directory instead of the real one, so
    // -Ppvzce.gameDir=... overrides it. Without this, every screenshot run wrote a save
    // into the developer's actual game directory.
    if (project.hasProperty('pvzce.gameDir')) {
        args '--gameDir', project.property('pvzce.gameDir').toString()
    }
}

tasks.named('jar') {
    // The distributable artifact is the shadow jar below.
    archiveClassifier = 'thin'
}

shadowJar {
    archiveBaseName = 'pvzce'
    archiveVersion = ''
    archiveClassifier = ''
    archiveFileName = 'pvzce-1.0.jar'

    mergeServiceFiles()

    // Keep all forks under their original package names; only relocate
    // libraries that collide inside the fat jar.
    relocate 'org.sat4j', 'net.fabricmc.loader.impl.lib.sat4j'
    relocate 'net.fabricmc.classtweaker', 'net.fabricmc.loader.impl.lib.classtweaker'
    relocate 'net.fabricmc.tinyremapper', 'net.fabricmc.loader.impl.lib.tinyremapper'
    relocate 'net.fabricmc.mappingio', 'net.fabricmc.loader.impl.lib.mappingio'

    exclude 'about.html'
    exclude 'sat4j.version'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes(
                'Main-Class': 'net.fabricmc.loader.impl.launch.knot.KnotClient',
                'Automatic-Module-Name': 'com.pvzce'
        )
    }
}

assemble.dependsOn shadowJar

// ---------------------------------------------------------------------------
// 本地素材（原版 PvZ 拆包资源）
//
// 原版素材的版权归 PopCap/EA，不能随公开仓库分发，所以它们被 `tools/exclude_pvz_assets.py`
// 移到了仓库根的 `local-assets/`（由 .gitignore 排除）。这个任务在**该目录存在时**把它并回
// 构建期资源，于是 `run`/`test`/冒烟照常拿得到贴图和音效；目录不存在（例如刚 clone 下来）
// 时任务自动跳过，游戏仍然能启动，只是缺贴图的地方显示为棋盘格。
//
// 这不算"两套资源"：它只是让本机的构建期资源 = 入库的自产素材 + 本机的原版素材，依赖的
// 单一出处仍是 `assets/pvzce/` 那一棵树，本任务不复制也不生成任何素材。
// ---------------------------------------------------------------------------
def localAssetsDir = rootProject.layout.projectDirectory.dir('local-assets')
def stageLocalAssets = tasks.register('stageLocalAssets', Copy) {
    description = '把 local-assets/ 里的原版素材并进构建期资源（目录不存在则跳过）'
    onlyIf { localAssetsDir.dir('assets').asFile.exists() }
    // 带上 `assets/` 这一层：classpath 资源根下面必须直接是 `assets/` 与 `data/`，
    // 少一层的话 TextureManager 按 `assets/<id>.png` 找不到东西。
    from localAssetsDir.dir('assets').asFile
    into layout.buildDirectory.dir('localAssets/assets')
}

// 本机的原版素材要**排在入库素材前面**，同一个 id 才由本地那份胜出（addFirst）。
// classpath 资源根必须是 `build/localAssets/`（它下面才是 `assets/`），
// 而 Copy 的 destinationDir 指向的是 `.../localAssets/assets` —— 取它的父目录。
def localAssetsRoot = stageLocalAssets.map { it.destinationDir.parentFile }
tasks.named('test') { dependsOn stageLocalAssets }
tasks.named('run') { dependsOn stageLocalAssets }
sourceSets.test.runtimeClasspath = files(localAssetsRoot) + sourceSets.test.runtimeClasspath
run.classpath = files(localAssetsRoot) + run.classpath
